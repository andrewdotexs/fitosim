[build-system]
# Il backend di build moderno raccomandato da PyPA. Richiede una versione
# recente di setuptools per supportare la configurazione interamente in
# pyproject.toml (PEP 621) senza un setup.cfg parallelo.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fitosim"
version = "0.45.0"
description = "Motore scientifico per la simulazione agronomica di piante in vaso: bilancio idrico, evapotraspirazione, calendario di cura."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Andrea" }
]
keywords = [
    "gardening", "agronomy", "FAO-56",
    "evapotranspiration", "irrigation", "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# Nessuna dipendenza runtime: il motore scientifico usa solo la standard
# library di Python. Questo è un vincolo architetturale che vogliamo
# mantenere a lungo: garantisce che fitosim si installi ovunque in pochi
# secondi, comprese piattaforme minimali come Termux su Android.
dependencies = []

# Dipendenze opzionali, installabili con `pip install -e '.[dev]'`: gli
# strumenti di chi ci lavora — i test, le regole, i tipi. Lo stack
# scientifico (numpy, matplotlib) serviva solo agli esempi, tolti con P1-a
# il 2026-11-24: la libreria e i suoi test girano con la sola standard
# library.
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
# Layout src/: evita che Python importi accidentalmente il pacchetto dalla
# directory di lavoro invece che dalla versione installata (un classico
# baco sottile). "where" dice a setuptools dove cercare i pacchetti.
where = ["src"]

[tool.pytest.ini_options]
# Aggiungere src/ al pythonpath dei test significa che possiamo lanciare
# `pytest` senza bisogno di installare il pacchetto, utile in CI e durante
# iterazioni rapide.
testpaths = ["tests"]
pythonpath = ["src"]

# ----- Gli strumenti (P3, docs/fitosim_pulizia_e_ottimizzazione.md) -----
# Le stesse regole di The Pot, che monta fitosim come dipendenza: una
# riga da 100, Python 3.12, e le famiglie E, W, F, I, N, UP, B, C4, SIM.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # la lunghezza della riga non si impone al codice che c'era

[tool.ruff.lint.per-file-ignores]
# Nei test `dict(...)` per gli argomenti di default si legge meglio di un
# letterale, e i nomi portano le unità come si scrivono (pH, 5L).
"tests/*" = ["C408", "N802"]
# I test dello strato standalone, congelato: le classi `Test_Cosa_caso` non
# si rinominano, se ne vanno con lo strato (P1-b).
"tests/test_measurement.py" = ["C408", "N802", "N801"]
"tests/test_sensors_*.py" = ["C408", "N802", "N801"]

[tool.mypy]
python_version = "3.12"
files = ["src/fitosim"]

# Lo strato standalone, congelato: se ne va con P1-b
# (docs/fitosim_pulizia_e_ottimizzazione.md) e fino ad allora non si tocca.
# I suoi errori di tipo — 22 il 2026-11-24 — tornano visibili togliendo
# questo blocco. La calibrazione comportamentale non è più qui: resta, e i
# suoi tipi sono a posto.
[[tool.mypy.overrides]]
module = [
    "fitosim.io.persistence",
    "fitosim.io.openmeteo",
    "fitosim.io.sensors.*",
    "fitosim.domain.garden",
]
ignore_errors = true
